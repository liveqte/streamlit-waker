name: Hourly Streamlit Wake Up

on:
  schedule:
    - cron: '0 */8 * * *'   # 每8小时，推荐
  workflow_dispatch:


jobs:
  check-apps:
    runs-on: ubuntu-latest
    
    # Set a timeout so it doesn't run forever if something gets stuck
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install Libraries
        run: |
          pip install -r requirements.txt
          
      - name: Export all secrets to env vars
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}
          
      - name: Run Wake Up Script
        run: python wake_up.py
